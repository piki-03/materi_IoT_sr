<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#0c0c0e" />
    </linearGradient>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a34" />
      <stop offset="100%" stop-color="#18181f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAAE2B" />
      <stop offset="100%" stop-color="#e09516" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C49F" />
      <stop offset="100%" stop-color="#00887A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)" stroke="#2b2b36" stroke-width="2"/>
  
  <!-- Grid Lines Decoration -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="520" />
    <line x1="150" y1="0" x2="150" y2="520" />
    <line x1="250" y1="0" x2="250" y2="520" />
    <line x1="350" y1="0" x2="350" y2="520" />
    <line x1="450" y1="0" x2="450" y2="520" />
    <line x1="550" y1="0" x2="550" y2="520" />
    <line x1="650" y1="0" x2="650" y2="520" />
    <line x1="750" y1="0" x2="750" y2="520" />
    <line x1="850" y1="0" x2="850" y2="520" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="260" x2="900" y2="260" />
    <line x1="0" y1="360" x2="900" y2="360" />
    <line x1="0" y1="460" x2="900" y2="460" />
  </g>

  <!-- Title Badge -->
  <rect x="35" y="24" width="340" height="34" rx="8" fill="#1e1e26" stroke="#FAAE2B" stroke-width="1.5"/>
  <text x="50" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FAAE2B" letter-spacing="1">SKEMA WOKWI ESP32 ➔ BLYNK IOT 2.0</text>

  <!-- WiFi & Cloud Header Badges -->
  <rect x="670" y="24" width="195" height="34" rx="8" fill="#1b2420" stroke="#00C49F" stroke-width="1.2"/>
  <circle cx="690" cy="41" r="5" fill="#00C49F" filter="url(#glow)"/>
  <text x="704" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#00E5BC">SSID: Wokwi-GUEST</text>

  <!-- ESP32 Board Illustration -->
  <g transform="translate(70, 95)">
    <!-- Board Body -->
    <rect width="260" height="370" rx="12" fill="url(#espGrad)" stroke="#3f3f50" stroke-width="2"/>
    
    <!-- USB Port -->
    <rect x="85" y="-12" width="90" height="24" rx="4" fill="#6c7086" stroke="#45475a" stroke-width="1"/>
    
    <!-- WiFi Metal Shield (ESP-WROOM-32) -->
    <rect x="45" y="40" width="170" height="150" rx="8" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
    <text x="130" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#cdd6f4">ESP-WROOM-32</text>
    <text x="130" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a6adc8">WiFi + Bluetooth Dual-Core</text>
    <circle cx="130" cy="150" r="12" fill="none" stroke="#FAAE2B" stroke-width="1.5"/>
    <path d="M125 150 Q130 145 135 150" stroke="#FAAE2B" stroke-width="1.5" fill="none"/>

    <!-- Pins Left -->
    <g fill="#bac2de" font-family="'Fira Code', monospace" font-size="9">
      <circle cx="15" cy="70" r="4" fill="#FAAE2B"/> <text x="26" y="73">3V3</text>
      <circle cx="15" cy="100" r="4" fill="#313244"/> <text x="26" y="103">EN</text>
      <circle cx="15" cy="130" r="4" fill="#313244"/> <text x="26" y="133">VP</text>
      <circle cx="15" cy="160" r="4" fill="#313244"/> <text x="26" y="163">VN</text>
      <circle cx="15" cy="190" r="4" fill="#313244"/> <text x="26" y="193">D34</text>
      <circle cx="15" cy="220" r="4" fill="#313244"/> <text x="26" y="223">D35</text>
      <circle cx="15" cy="250" r="4" fill="#00C49F"/> <text x="26" y="253" fill="#00E5BC" font-weight="bold">D15 (DHT)</text>
      <circle cx="15" cy="280" r="4" fill="#ff5555"/> <text x="26" y="283" fill="#ff79c6" font-weight="bold">D2 (LED)</text>
      <circle cx="15" cy="310" r="4" fill="#313244"/> <text x="26" y="313">D4</text>
      <circle cx="15" cy="340" r="4" fill="#89b4fa"/> <text x="26" y="343">GND</text>
    </g>

    <!-- Pins Right -->
    <g fill="#bac2de" font-family="'Fira Code', monospace" font-size="9" text-anchor="end">
      <circle cx="245" cy="70" r="4" fill="#89b4fa"/> <text x="234" y="73">GND</text>
      <circle cx="245" cy="100" r="4" fill="#313244"/> <text x="234" y="103">D23</text>
      <circle cx="245" cy="130" r="4" fill="#313244"/> <text x="234" y="133">D22</text>
      <circle cx="245" cy="160" r="4" fill="#313244"/> <text x="234" y="163">TX0</text>
      <circle cx="245" cy="190" r="4" fill="#313244"/> <text x="234" y="193">RX0</text>
      <circle cx="245" cy="220" r="4" fill="#313244"/> <text x="234" y="223">D21</text>
      <circle cx="245" cy="250" r="4" fill="#313244"/> <text x="234" y="253">D19</text>
      <circle cx="245" cy="280" r="4" fill="#313244"/> <text x="234" y="283">D18</text>
      <circle cx="245" cy="310" r="4" fill="#313244"/> <text x="234" y="313">D5</text>
      <circle cx="245" cy="340" r="4" fill="#f38ba8"/> <text x="234" y="343">VIN (5V)</text>
    </g>

    <!-- Onboard LED -->
    <rect x="200" y="295" width="12" height="18" rx="2" fill="#24273a" stroke="#45475a"/>
    <circle cx="206" cy="304" r="3" fill="#89b4fa" filter="url(#glow)"/>
    <text x="206" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#6c7086" text-anchor="middle">BLUE LED</text>
  </g>

  <!-- Wiring Lines (Cables with glowing style) -->
  <!-- Wire D2 to LED -->
  <path d="M 85 375 L 40 375 L 40 470 L 450 470 L 450 410" fill="none" stroke="#ff5555" stroke-width="3" stroke-linecap="round"/>
  <circle cx="450" cy="410" r="4" fill="#ff5555" filter="url(#glow)"/>

  <!-- Wire D15 to DHT22 Data -->
  <path d="M 85 345 L 20 345 L 20 230 L 480 230 L 480 210" fill="none" stroke="#00E5BC" stroke-width="3" stroke-linecap="round"/>
  <circle cx="480" cy="210" r="4" fill="#00E5BC" filter="url(#glow)"/>

  <!-- Wire 3V3 to DHT22 VCC -->
  <path d="M 85 165 L 50 165 L 50 110 L 440 110 L 440 210" fill="none" stroke="#FAAE2B" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round"/>

  <!-- Wire GND to Common Rail -->
  <path d="M 85 435 L 60 435 L 60 495 L 520 495 L 520 210" fill="none" stroke="#6272a4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Component 1: LED Indicator Module -->
  <g transform="translate(420, 290)">
    <rect width="180" height="130" rx="10" fill="#1b1c24" stroke="#ff5555" stroke-width="1.8"/>
    <rect x="15" y="-12" width="120" height="24" rx="6" fill="#ff5555"/>
    <text x="75" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">AKTUATOR: LED</text>
    
    <!-- LED Icon -->
    <circle cx="90" cy="48" r="16" fill="#ff5555" filter="url(#glow)"/>
    <circle cx="90" cy="48" r="9" fill="#ffffff"/>
    
    <text x="90" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GPIO 2 ➔ Blynk V0</text>
    <text x="90" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#a6adc8" text-anchor="middle">Kontrol ON / OFF Switch</text>
  </g>

  <!-- Component 2: DHT22 Sensor Module -->
  <g transform="translate(420, 100)">
    <rect width="180" height="150" rx="10" fill="#1b1c24" stroke="#00C49F" stroke-width="1.8"/>
    <rect x="15" y="-12" width="135" height="24" rx="6" fill="#00C49F"/>
    <text x="82" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0b1b16" text-anchor="middle">SENSOR: DHT22</text>
    
    <!-- Sensor Grid Holes -->
    <rect x="25" y="25" width="45" height="55" rx="4" fill="#23352f" stroke="#00C49F" stroke-width="1"/>
    <circle cx="37" cy="40" r="2.5" fill="#00E5BC"/>
    <circle cx="48" cy="40" r="2.5" fill="#00E5BC"/>
    <circle cx="58" cy="40" r="2.5" fill="#00E5BC"/>
    <circle cx="37" cy="55" r="2.5" fill="#00E5BC"/>
    <circle cx="48" cy="55" r="2.5" fill="#00E5BC"/>
    <circle cx="58" cy="55" r="2.5" fill="#00E5BC"/>

    <text x="82" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#00E5BC">Pin Data: GPIO 15</text>
    <text x="82" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#bac2de">Suhu: 28.5 °C (V1)</text>
    <text x="82" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#bac2de">Lembab: 65 % (V2)</text>

    <!-- Blynk Datastream Info -->
    <rect x="15" y="95" width="150" height="38" rx="6" fill="#14211c" stroke="#00887a" stroke-width="1"/>
    <text x="90" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#00E5BC" text-anchor="middle">Datastream Blynk:</text>
    <text x="90" y="125" font-family="'Fira Code', monospace" font-size="9" fill="#e0f8f1" text-anchor="middle">V1 (Suhu) &amp; V2 (Lembab)</text>
  </g>

  <!-- Right Side: Blynk Cloud 2.0 Integration Visual -->
  <g transform="translate(640, 100)">
    <rect width="225" height="320" rx="14" fill="#191922" stroke="#FAAE2B" stroke-width="1.8"/>
    
    <rect x="25" y="-12" width="175" height="26" rx="7" fill="url(#goldGrad)"/>
    <text x="112" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#111115" text-anchor="middle">BLYNK CLOUD 2.0</text>

    <!-- Cloud Icon -->
    <path d="M 85 55 A 18 18 0 0 1 115 42 A 26 26 0 0 1 150 55 A 18 18 0 0 1 145 78 L 85 78 A 14 14 0 0 1 85 55 Z" fill="#292938" stroke="#FAAE2B" stroke-width="2"/>
    <text x="112" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">blynk.cloud (Port 80/443)</text>
    
    <!-- Virtual Pins List -->
    <g transform="translate(15, 120)">
      <!-- V0 Card -->
      <rect width="195" height="42" rx="8" fill="#1e1e28" stroke="#ff5555" stroke-width="1"/>
      <circle cx="20" cy="21" r="9" fill="#ff5555"/>
      <text x="20" y="25" font-family="'Fira Code', monospace" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">V0</text>
      <text x="40" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Switch Relay / LED</text>
      <text x="40" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#a6adc8">Nilai Integer: 0 atau 1</text>

      <!-- V1 Card -->
      <g transform="translate(0, 50)">
        <rect width="195" height="42" rx="8" fill="#1e1e28" stroke="#00C49F" stroke-width="1"/>
        <circle cx="20" cy="21" r="9" fill="#00C49F"/>
        <text x="20" y="25" font-family="'Fira Code', monospace" font-size="9" font-weight="800" fill="#091b16" text-anchor="middle">V1</text>
        <text x="40" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Gauge Sensor Suhu</text>
        <text x="40" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#a6adc8">Rentang: 0.0 - 50.0 °C</text>
      </g>

      <!-- V2 Card -->
      <g transform="translate(0, 100)">
        <rect width="195" height="42" rx="8" fill="#1e1e28" stroke="#89b4fa" stroke-width="1"/>
        <circle cx="20" cy="21" r="9" fill="#89b4fa"/>
        <text x="20" y="25" font-family="'Fira Code', monospace" font-size="9" font-weight="800" fill="#11111b" text-anchor="middle">V2</text>
        <text x="40" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff">Label Kelembapan</text>
        <text x="40" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#a6adc8">Rentang: 20% - 90%</text>
      </g>
    </g>

    <!-- Token Security Badge -->
    <rect x="20" y="280" width="185" height="24" rx="6" fill="#242119" stroke="#FAAE2B" stroke-width="1"/>
    <text x="112" y="296" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FAAE2B" text-anchor="middle">🔑 Auth Token (32-Char Secret)</text>
  </g>

  <!-- Bottom Legend Banner -->
  <g transform="translate(180, 475)">
    <circle cx="0" cy="0" r="4" fill="#ff5555"/><text x="10" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cdd6f4">Pin Digital (LED)</text>
    <circle cx="120" cy="0" r="4" fill="#00E5BC"/><text x="130" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cdd6f4">Pin Data (Sensor)</text>
    <circle cx="250" cy="0" r="4" fill="#FAAE2B"/><text x="260" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cdd6f4">Daya (3.3V)</text>
    <circle cx="340" cy="0" r="4" fill="#6272a4"/><text x="350" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cdd6f4">Ground (GND)</text>
  </g>
</svg>
